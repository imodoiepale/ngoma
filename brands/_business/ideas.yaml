# The studio's business ideas: one source of truth for docs/business/, Notion and the map.
#
# MRR and cost are COMPUTED by packages/strategy/business_os.py from the inputs below,
# never typed, so a changed price or GPU rate updates every document at once.
#
#   price_usd        what one client/unit pays per month (one-off offers: price per unit,
#                    and `units` is units sold per month)
#   clients          [low, base, high] paying clients (or units) per month
#   gpu_hours        GPU-hours needed per client per month (A100 80GB unless `gpu` says)
#   api_usd          hosted-model spend per client per month
#   setup_usd        one-time budget to launch (templates, samples, accounts, ads test)
#   fixed_usd        monthly fixed spend regardless of clients (tools, ads, pod idle)
#   first_cash_days  realistic days to the first payment
#   labor_hours      optional: human hours per client (or unit) per month; defaults by family
#                    in business_os.LABOR_HOURS, priced at an assumed $15/h
#
# ALL FIGURES ARE PLANNING ESTIMATES (2026-09-13), not forecasts. Throughput anchors:
# images 444/GPU-h MEASURED (Klein T2I on the pod); video ~20 five-second clips/GPU-h and
# RefMod creation <1 min are ASSUMED until measured on our pod.
#
# evidence: why we believe buyers exist, from the harvested creators (views on the video).

