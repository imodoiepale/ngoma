brand: ongea-pesa
count: 24
principle: Fix the system (field, composition, light, palette, finish, negatives); vary only the subject and the
  copy. Adapted from the TUDOR.AI poster-prompt method - see tudor-poster-prompts-source.pdf.
hard_rules:
- The model renders NO text and NO marks. All copy and the logo are composited in code.
- One accent per composition.
- Every style must reserve a low-detail zone for the headline.
