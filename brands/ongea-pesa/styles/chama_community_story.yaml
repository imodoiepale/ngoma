generates: base visual only
text_policy: NONE - all copy composited in code
logo_policy: COMPOSITE_ONLY - model must not render any mark
disclosure_field: AI-assisted imagery. Demonstration only.
accessibility:
  min_contrast: 4.5:1 for composited copy
  reserve_copy_zone: model must leave a clean low-detail area for headline
  caption_required: true
experiment_variables:
- hook
- first_slide
- language
- sheng_intensity
- cta
- subject
key: chama_community_story
mode: african_human
audience: groups, savings circles, families
campaigns:
- group payment
- community
ratios:
- '4:5'
- '1:1'
- '9:16'
background: a warm real interior
composition: a group of three to five around a table, copy band across the top third
subject: a Kenyan chama or family group mid-conversation, money-adjacent objects present but never readable
light: warm practical plus window
palette:
- '#121212'
- '#FEFEFE'
- '#22C55E'
accent_use: small
finish: warm documentary, natural
cultural: collective and joyful, no staged poverty
negative_prompt: no logos of any kind, no wordmarks, no text, no letters, no numbers, no UI text, no watermark,
  no signature, no telecom or bank branding, no crypto symbols, no fake phone screens with readable text, no poverty
  stereotypes, no distorted hands, no extra fingers, no mangled faces, no celebrity likeness, no real till numbers,
  no readable account numbers
brand: ongea-pesa
ratio_note: 9:16 added for reel/story use; the composition rule still applies - reserve the quiet zone in the vertical
  crop, not the 4:5 one
